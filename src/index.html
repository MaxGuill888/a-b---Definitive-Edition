[data-theme=light] #wp{filter:invert(1)}
#stage{position:absolute;left:50%;top:50%;width:1366px;height:768px;margin:-384px 0 0 -683px;transform-origin:center}
.cell{position:absolute;width:92px;height:92px}
.cell.g{transform:scale(.78);transform-origin:46px 46px}
.cell span{position:absolute;top:101px;left:50%;transform:translateX(-50%);width:150px;text-align:center;font-size:18px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.cell.dragging{z-index:50}.cell.dragging .tile{box-shadow:0 8px 24px rgba(0,0,0,.5);transition:none;cursor:grabbing}
.tile{width:92px;height:92px;border-radius:20px;background:var(--tile);border:1px solid var(--bd);display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;color:var(--fg);transition:transform .15s,filter .15s;touch-action:none}
button.tile:hover{transform:scale(1.06);filter:brightness(1.2)}
button.tile:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.tile img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.tile img.si{width:54%;height:54%;object-fit:contain;filter:var(--icf)}
.tile svg{width:54%;height:54%}
.letter{font-weight:700;font-size:40px;width:100%;height:100%;display:grid;place-items:center;color:#fff}
#dockw{position:absolute;inset:0;transform:scale(.78);transform-origin:671px 737px;pointer-events:none}
#dockw .cell{pointer-events:auto}
#dockbg{position:absolute;left:225px;top:619px;width:893px;height:118px;border:1px solid var(--bd);border-radius:40px;background:var(--dock);backdrop-filter:blur(18px)}
#sep{position:absolute;left:1021px;top:646px;width:3px;height:66px;border-radius:2px;background:var(--bd)}
#date{position:absolute;left:34px;top:645px;width:160px;text-align:center;font-weight:700;font-size:26px;line-height:35px;transform:scale(.8)}
#clock{position:absolute;left:1166px;top:650px;width:176px;text-align:center;font-weight:700;font-size:48px;line-height:60px;white-space:nowrap;transform:scale(.8)}
#nc{position:absolute;left:1037px;top:632px}
#nc .dot{position:absolute;top:10px;right:12px;width:10px;height:10px;border-radius:50%;background:#ff5a4f;border:2px solid var(--tile)}
/* fenêtres */
#layer{position:fixed;inset:0;pointer-events:none}
.win{position:fixed;left:0;top:0;transform:scale(var(--z));transform-origin:0 0;pointer-events:auto;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.45);font-size:12px}
.win.max{border-radius:0;border:0}
.tb{height:24px;flex:none;display:flex;align-items:center;padding:0 6px 0 11px;touch-action:none}
.tt{flex:1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{background:none;border:0;color:var(--fg);width:19px;height:19px;border-radius:5px;display:grid;place-items:center;cursor:pointer;padding:0}
.tb button[hidden]{display:none}
.tb button:hover{background:var(--hov)}
.tb .ex{font-size:10px;padding:2px 7px;width:auto;border:1px solid var(--bd);margin-right:6px;display:block}
.tb svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.3}
.tb .zapb svg{fill:currentColor;stroke:none;width:10px;height:10px}
.tb .zapb.on{background:var(--fg);color:var(--ct)}
.wb{flex:1;min-height:0;display:flex;padding:0;border-radius:0 0 10px 10px}
.wb iframe{flex:1;border:0;background:#fff;border-radius:0 0 9px 9px;width:100%}
.btn{background:var(--field);color:var(--fg);border:0;border-radius:8px;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer}.btn:hover{filter:brightness(1.2)}
.hint{font-size:10.5px;color:var(--mut)}
.h{position:absolute}.h[data-e=n]{left:10px;right:10px;top:-4px;height:8px;cursor:ns-resize}.h[data-e=s]{left:10px;right:10px;bottom:-4px;height:8px;cursor:ns-resize}
.h[data-e=w]{top:10px;bottom:10px;left:-4px;width:8px;cursor:ew-resize}.h[data-e=e]{top:10px;bottom:10px;right:-4px;width:8px;cursor:ew-resize}
.h[data-e=nw]{left:-4px;top:-4px;width:14px;height:14px;cursor:nwse-resize}.h[data-e=se]{right:-4px;bottom:-4px;width:14px;height:14px;cursor:nwse-resize}
.h[data-e=ne]{right:-4px;top:-4px;width:14px;height:14px;cursor:nesw-resize}.h[data-e=sw]{left:-4px;bottom:-4px;width:14px;height:14px;cursor:nesw-resize}
.win.max .h{display:none}.dragging iframe{pointer-events:none}.dragging{user-select:none}
.zp{position:absolute;top:28px;right:8px;width:250px;max-height:60%;z-index:5;background:var(--ct);border:1px solid var(--bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.zp[hidden]{display:none}
.zp input{background:var(--field);border:0;border-radius:8px;color:var(--fg);padding:6px 8px;font:inherit;font-size:11.5px;outline:0;user-select:text}
.zl h4{font-size:10px;color:var(--mut);margin:4px 6px 2px;font-weight:600}
.zl{overflow:auto;display:flex;flex-direction:column}
.zl div{padding:4px 6px;border-radius:6px;cursor:pointer;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zl div:hover{background:var(--hov)}
.toast{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);zoom:var(--z);max-width:60vw;background:var(--fg);color:var(--ct);padding:8px 14px;border-radius:12px;font-size:12px;z-index:10000;text-align:center}
#np{position:fixed;right:10px;top:10px;width:250px;max-height:70vh;zoom:var(--z);background:var(--win);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.45);z-index:9999;font-size:12px}
#np[hidden]{display:none}
#np .nh{display:flex;justify-content:space-between;align-items:center}
#nl{overflow:auto;display:flex;flex-direction:column;gap:6px}
#nl div{background:var(--ct);border-radius:10px;padding:7px 9px;font-size:11.5px}#nl small{display:block;color:var(--mut);font-size:10px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}

<body>
<div id="wp"></div>
<div id="stage"></div>
<div id="layer"></div>
<div id="np" hidden><div class="nh"><b>Centre de notifications</b><button class="btn" id="clr">Effacer</button></div><div id="nl"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let apps=store.get('apps',[]),layout=store.get('layout',{});
let cfg=Object.assign({theme:'dark',h24:true,sec:false,zap:false},store.get('cfg',{}));
const BELL='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a4 4 0 0 0-4 4v2.5L2.6 11h10.8L12 8.5V6a4 4 0 0 0-4-4zM6.5 13a1.5 1.5 0 0 0 3 0"/></svg>';
/* ROOT = chemin vers le dossier src/ : vide quand index.html est dans src/, 'src/' si la page est servie depuis la racine.
   Apps système : 'Dossier:Nom affiché' -> apps/Dossier/Dossier.html + apps/Dossier/icons/Dossier.svg
   Pour ajouter une app, ajoute par exemple 'Ai:Ai' ou 'Chat:Chat'. */
const ROOT=/\/src(\/|$)/.test(location.pathname)?'':'src/';
const BUILTIN=['Settings:Paramètres','Store:App Store'].map(s=>{const[d,n]=s.split(':');
 return{id:d,name:n,def:1,src:`${ROOT}apps/${d}/${d}.html`,icon:`${ROOT}apps/${d}/icons/${d}.svg`}});
let Z=1.5,S=1;
function fit(){
 S=Math.min(innerWidth/1366,innerHeight/768);
 $('#stage').style.transform=`scale(${S})`;
 Z=1.5*S;document.documentElement.style.setProperty('--z',Z);
 Object.values(wins).forEach(place);
}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const letter=n=>`<div class="letter" style="background:hsl(${hue(n)} 35% 32%)">${esc((n[0]||'?').toUpperCase())}</div>`;
function iconHTML(a){
 if(!a.icon)return letter(a.name);
 const mono=a.def||a.repo&&/\.svg(\?|$)/i.test(a.icon);
 return `<img${mono?' class="si"':''} src="${esc(a.icon)}" alt="" draggable="false" onerror="this.outerHTML=this.dataset.f" data-f="${esc(letter(a.name))}">`;
}
/* ---------- écran d'accueil : emplacements 0-23 (grille) et 24-30 (dock) ---------- */
const slotPos=i=>i<24?{x:46+168.86*(i%8),y:77+174.5*(i/8|0),dock:false}:{x:210+118.2*(i-24),y:632,dock:true};
const slotCenter=i=>{const p=slotPos(i);let x=p.x+46,y=p.y+46;if(p.dock){x=671+(x-671)*.78;y=737+(y-737)*.78}return{x,y}};
function slots(all){
 const used=new Set(),out={};
 all.forEach(a=>{const s=layout[a.id];if(Number.isInteger(s)&&s>=0&&s<31&&!used.has(s)){out[a.id]=s;used.add(s)}});
 let n=0;all.forEach(a=>{if(out[a.id]===undefined){while(used.has(n))n++;out[a.id]=n;used.add(n)}});
 return out;
}
let suppress=false;
function cell(a,p,slot){
 const c=document.createElement('div');c.className='cell'+(p.dock?'':' g');c.style.left=p.x+'px';c.style.top=p.y+'px';
 c.innerHTML=`<button class="tile" aria-label="${esc(a.name)}">${iconHTML(a)}</button>${p.dock?'':`<span>${esc(a.name)}</span>`}`;
 const b=c.firstChild;
 b.onclick=()=>{if(!suppress)openApp(a)};
 b.onpointerdown=e=>dragIcon(e,c,a,slot,p.dock);
 return c;
}
function dragIcon(e,c,a,slot,dock){
 if(e.button>0)return;
 const sx=e.clientX,sy=e.clientY,k=S*(dock?.78:1);let on=false;
 const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
  if(!on&&Math.hypot(dx,dy)>6){on=true;c.classList.add('dragging');document.body.classList.add('dragging')}
  if(on)c.style.transform=`translate(${dx/k}px,${dy/k}px)`+(dock?'':' scale(.78)')};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
  document.body.classList.remove('dragging');
  if(!on)return;suppress=true;setTimeout(()=>suppress=false);
  const r=$('#stage').getBoundingClientRect(),s=r.width/1366,px=(ev.clientX-r.left)/s,py=(ev.clientY-r.top)/s;
  let best=-1,bd=1e9;for(let i=0;i<31;i++){const q=slotCenter(i),d=Math.hypot(q.x-px,q.y-py);if(d<bd){bd=d;best=i}}
  if(bd<70&&best!==slot){const sl=slots([...BUILTIN,...apps]),other=Object.keys(sl).find(id=>sl[id]===best);
   if(other)sl[other]=slot;sl[a.id]=best;layout=sl;store.set('layout',layout)}
  render()};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function render(){
 const all=[...BUILTIN,...apps],st=$('#stage'),sl=slots(all);
 st.innerHTML='<div id="date"></div><div id="clock"></div><div id="dockw"><div id="dockbg"></div><div id="sep"></div></div>';
 const dw=$('#dockw');
 all.forEach(a=>{const s=sl[a.id];if(s>30)return;const p=slotPos(s);(p.dock?dw:st).append(cell(a,p,s))});
 const n=document.createElement('div');n.id='nc';n.className='cell';
 n.innerHTML=`<button class="tile" aria-label="Centre de notifications">${BELL}</button>${unread?'<i class="dot"></i>':''}`;
 n.firstChild.onclick=e=>{e.stopPropagation();toggleNP()};dw.append(n);clock();
}
function clock(){
 const d=new Date(),p=x=>String(x).padStart(2,'0');let h=d.getHours();if(!cfg.h24)h=h%12||12;
 const c=$('#clock');if(!c)return;
 c.textContent=`${p(h)}:${p(d.getMinutes())}`+(cfg.sec?':'+p(d.getSeconds()):'');
 const w=d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','');
 $('#date').innerHTML=`${esc(w[0].toUpperCase()+w.slice(1))} ${d.getDate()}<br>${p(d.getMonth()+1)}/${d.getFullYear()}`;
}
/* ---------- notifications ---------- */
let notes=[],unread=0;
function notify(t){notes.unshift({t,d:new Date()});unread++;renderNP();render()}
function renderNP(){$('#nl').innerHTML=notes.length?notes.map(n=>`<div>${esc(n.t)}<small>${n.d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):'<p class="hint">Aucune notification.</p>'}
function toggleNP(){const p=$('#np');p.hidden=!p.hidden;if(!p.hidden){unread=0;renderNP();render()}}
$('#clr').onclick=()=>{notes=[];renderNP()};
addEventListener('pointerdown',e=>{const p=$('#np');if(!p.hidden&&!p.contains(e.target)&&!e.target.closest('#nc'))p.hidden=true});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;$('#np').hidden=true;zapOffAll()});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),5000)}
/* ---------- fenêtres ---------- */
const wins={};let zi=10,nwin=0;
const MINW=360,MINH=220;
function place(w){
 const s=w.el.style;
 if(w.max){s.left=s.top='0';s.width=innerWidth/Z+'px';s.height=innerHeight/Z+'px'}
 else{s.left=w.x*Z+'px';s.top=w.y*Z+'px';s.width=w.w+'px';s.height=w.h+'px'}

function focus(w){w.el.style.zIndex=++zi}
function drag(e,w,mode){

 const mv=ev=>{const dx=(ev.clientX-sx)/Z,dy=(ev.clientY-sy)/Z;
  if(mode==='move'){w.x=o.x+dx;w.y=Math.max(0,o.y+dy)}else{
   if(mode.includes('e'))w.w=Math.max(MINW,o.w+dx);
   if(mode.includes('s'))w.h=Math.max(MINH,o.h+dy);
   if(mode.includes('w')){const nw=Math.max(MINW,o.w-dx);w.x=o.x+o.w-nw;w.w=nw}
   if(mode.includes('n')){const nh=Math.max(MINH,o.h-dy);w.y=Math.max(0,o.y+o.h-nh);w.h=nh}}

function openWin(key,title,extra=''){

 el.innerHTML=`<div class="tb"><span class="tt">${esc(title)}</span>${extra}
 <button class="zapb" aria-label="Zappeur d'éléments" title="Zappeur d'éléments (clic droit : rechercher)"${cfg.zap?'':' hidden'}><svg viewBox="0 0 10 10"><path d="M6.2.4L1.8 5.6h2.4L3.6 9.6l4.6-5.4H5.8z"/></svg></button>
 <button data-a="min" aria-label="Réduire"><svg viewBox="0 0 10 10"><path d="M1 8.5h8"/></svg></button>
 <button data-a="max" aria-label="Agrandir"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg></button>
 <button data-a="x" aria-label="Fermer"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button></div>
 <div class="wb"></div>`+['n','s','e','w','ne','nw','se','sw'].map(d=>`<i class="h" data-e="${d}"></i>`).join('');
 $('#layer').append(el);
 const w={el,x:Math.max(0,(innerWidth/Z-580)/2+nwin%5*18),y:Math.max(0,(innerHeight/Z-345)/2+nwin%5*18),w:580,h:345,max:false};nwin++;wins[key]=w;
 const tog=()=>{w.max=!w.max;place(w)};
 el.querySelectorAll('.h').forEach(h=>h.onpointerdown=e=>drag(e,w,h.dataset.e));
 el.querySelector('.tb').onpointerdown=e=>{if(!e.target.closest('button'))drag(e,w,'move')};
 el.querySelector('.tb').ondblclick=e=>{if(!e.target.closest('button'))tog()};
 el.onpointerdown=()=>focus(w);
 el.querySelector('[data-a=min]').onclick=()=>el.hidden=true;
 el.querySelector('[data-a=max]').onclick=tog;
 el.querySelector('[data-a=x]').onclick=()=>closeWin(key);

}
function closeWin(id){if(wins[id]){wins[id].el.remove();delete wins[id];zapSync()}}
const PERMS='fullscreen; pointer-lock; keyboard-map; gamepad; autoplay; clipboard-read; clipboard-write; microphone; camera; accelerometer; gyroscope; encrypted-media; web-share';
const SBOX='allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation allow-orientation-lock';
function openApp(a){
 const url=a.type==='url';
 const b=openWin(a.id,a.name,url?'<button class="ex">Ouvrir dans un onglet</button>':'');
 if(!b)return;
 const w=wins[a.id],f=document.createElement('iframe');w.frame=f;w.zap=false;
 f.setAttribute('allow',PERMS);
 if(a.def){f.src=a.src;f.dataset.sys=1;f.style.background='transparent'}
 else if(url){f.src=a.src;f.setAttribute('sandbox',SBOX+' allow-same-origin');w.el.querySelector('.ex').onclick=()=>window.open(a.src,'_blank','noopener')}
 else{f.srcdoc=withZap(a.src);f.setAttribute('sandbox',SBOX)}
 b.append(f);
 /* ⚡ : zappe l'app (si on peut y accéder) ET la page abOS elle-même (y compris ce qu'une extension y ajoute) */
 const zb=w.el.querySelector('.zapb');
 const prep=()=>{try{w.cap=!!(a.def||a.type==='html'||(a.repo&&f.contentDocument))}catch(e){w.cap=!!(a.def||a.type==='html')}
  if(w.cap){injectZap(f);if(a.def)zpost(w,{zapcode:'('+zapper+')()'})}};
 zb.onclick=()=>{w.zap=!w.zap;zb.classList.toggle('on',w.zap);prep();
  if(w.cap)zpost(w,{zap:w.zap?'on':'off'});
  else if(w.zap)toast("Zappeur actif sur abOS. Le contenu du site externe reste inaccessible (protection du navigateur) : clique sur la fenêtre pour la supprimer, ou sur ce qu'une extension a ajouté.");

}
/* ---------- zappeur d'éléments ---------- */
const zpost=(w,m)=>{try{w.frame.contentWindow.postMessage(m,'*')}catch(e){}};
function injectZap(f){try{const d=f.contentDocument;if(d&&d.defaultView&&!d.defaultView.__zap){const s=d.createElement('script');s.textContent='('+zapper+')()';d.documentElement.append(s)}}catch(e){}}
/* Zappeur de la page hôte : permet de supprimer ce qu'une extension ajoute par-dessus l'iframe (même d'un site externe) */
let HZ;
const hostZap=()=>HZ||(HZ=zapper({skip:e=>!!e.closest('.zapb,.zp,.toast'),send(){},fwd:d=>Object.values(wins).forEach(w=>{if(w.zap&&w.cap)zpost(w,{zap:'lvl',d})})}));
function zapSync(){const ws=Object.values(wins),any=ws.some(x=>x.zap);if(!any&&!HZ)return;const nf=!ws.some(x=>x.zap&&x.cap);hostZap().set(any,nf,nf)}
function zapOffAll(){Object.values(wins).forEach(w=>{if(w.zap){w.zap=false;w.el.querySelector('.zapb').classList.remove('on');zpost(w,{zap:'off'})}});zapSync()}
function zapPanel(w){
 let p=w.el.querySelector('.zp');
 if(p){p.hidden=!p.hidden;if(!p.hidden){p.querySelector('input').focus();w.search()}return}
 p=document.createElement('div');p.className='zp';
 p.innerHTML='<input type="text" placeholder="Nom, id, classe ou texte…" aria-label="Rechercher un élément"><div class="zl"></div><button class="btn zu">Annuler le dernier zap</button>';
 w.el.append(p);const i=p.querySelector('input');w.hl=[];w.fl=[];
 w.search=()=>{const q=i.value.trim();w.hl=hostZap().find(q);drawZ(w);if(w.cap)zpost(w,{zap:'find',q})};
 i.oninput=w.search;
 p.querySelector('.zu').onclick=()=>{hostZap().undo();zpost(w,{zap:'undo'});setTimeout(w.search,50)};
 i.focus();w.search();
}
function drawZ(w){
 const l=w.el.querySelector('.zl');if(!l)return;
 const sec=(t,a,s)=>a.length?`<h4>${t}</h4>`+a.map((x,i)=>`<div data-s="${s}" data-i="${i}">${esc(x)}</div>`).join(''):'';
 l.innerHTML=sec('Page autour (extensions, interface)',w.hl||[],'h')+sec("Contenu de l'app",w.fl||[],'f')||'<p class="hint">Aucun élément trouvé.</p>';
 l.querySelectorAll('div').forEach(x=>{const h=x.dataset.s==='h',i=+x.dataset.i;
  x.onmouseenter=()=>h?hostZap().hl(i):zpost(w,{zap:'hl',i});
  x.onclick=()=>{if(h){w.hl=hostZap().rm(i);drawZ(w)}else zpost(w,{zap:'rm',i})}});
}
function zapMsg(w,d){
 if(d.zap==='off'){w.zap=false;w.el.querySelector('.zapb').classList.remove('on');zapSync()}
 if(d.zap==='found'&&Array.isArray(d.list)){w.fl=d.list.map(String);drawZ(w)}
}
/* Zappeur : exécuté DANS la page zappée (injecté, ou ajouté au début du fichier HTML),
   ou appelé avec une option H pour zapper la page hôte (index.html). Renvoie un contrôleur. */
function zapper(H){
 const host=!!H;
 if(!host){if(window.__zap)return;window.__zap=1}
 let on=false,sel=null,up=[],found=[],stack=[],box,hint,sty;
 const send=host?H.send:m=>parent.postMessage(m,'*');
 const NO=/^(HEAD|SCRIPT|STYLE|LINK|META|NOSCRIPT|TITLE)$/;
 const ok=e=>e&&e.nodeType===1&&e!==box&&e!==hint&&e!==sty&&e!==document.documentElement&&e!==document.body&&!(host&&H.skip(e));
 const ensure=()=>{if(box)return;
  box=document.createElement('div');hint=document.createElement('div');
  hint.style.cssText='position:fixed;z-index:2147483647;left:50%;top:8px;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:#111;color:#fff;font:12px system-ui,sans-serif;pointer-events:none;display:none;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.5)';
  hint.textContent='Zappeur actif : clic = supprimer · ↑ ↓ = parent / enfant · Échap = quitter';
  const add=[box,hint];
  sty=document.createElement('style');sty.textContent='iframe,embed,object{pointer-events:none!important}';sty.disabled=true;add.push(sty);
  document.documentElement.append(...add)};
 const paint=(e,c)=>{ensure();if(!e||!document.documentElement.contains(e)){box.style.display='none';return}const r=e.getBoundingClientRect();
  box.style.cssText='position:fixed;z-index:2147483647;pointer-events:none;box-sizing:border-box;border:2px solid '+c+';background:'+(c==='#ff3b30'?'rgba(255,59,48,.28)':'rgba(255,204,0,.3)')+';left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px'};
 const pick=e=>{sel=ok(e)?e:null;paint(sel,'#ff3b30')};
 const hide=e=>{stack.push({e:e,s:e.getAttribute('style')});e.style.setProperty('display','none','important')};
 const undo=()=>{const s=stack.pop();if(!s)return;if(s.s===null)s.e.removeAttribute('style');else s.e.setAttribute('style',s.s)};
 const lab=e=>{let s=e.tagName.toLowerCase();if(e.id)s+='#'+e.id;const c=(typeof e.className==='string'?e.className:'').trim().split(/\s+/).filter(Boolean).slice(0,2);if(c.length)s+='.'+c.join('.');const t=(e.textContent||'').trim().replace(/\s+/g,' ').slice(0,30);return t?s+' — '+t:s};

 const mv=ev=>{up=[];pick(document.elementFromPoint(ev.clientX,ev.clientY))};
 const ck=ev=>{if(host&&!sel)return;ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();const t=sel||document.elementFromPoint(ev.clientX,ev.clientY);if(ok(t)){hide(t);sel=null;box.style.display='none'}};
 const blk=ev=>{if(host&&!sel)return;ev.preventDefault();ev.stopPropagation()};
 const out=ev=>{if(!ev.relatedTarget)pick(null)};
 const kd=ev=>{const k=ev.key;
  if(!host&&k==='Escape'){ev.preventDefault();set(false);send({zap:'off'})}
  else if(k==='ArrowUp'||k==='ArrowDown'){const dd=k==='ArrowUp'?-1:1,typing=/^(INPUT|TEXTAREA)$/.test((ev.target&&ev.target.tagName)||'');
   if(sel&&!typing){ev.preventDefault();lvl(dd)}
   if(host&&H.fwd&&!typing)H.fwd(dd)}
  else if((ev.ctrlKey||ev.metaKey)&&k==='z'&&!/^(INPUT|TEXTAREA)$/.test((ev.target&&ev.target.tagName)||'')){ev.preventDefault();undo()}};
 const E=[['mousemove',mv],['mouseout',out],['click',ck],['mousedown',blk],['mouseup',blk],['pointerdown',blk],['pointerup',blk],['dblclick',blk],['contextmenu',blk],['keydown',kd]];
 const O={capture:true,passive:false};
 const set=(v,h,fr)=>{v=!!v;ensure();
  sty.disabled=!(v&&(!host||fr));if(v!==on){on=v;E.forEach(x=>v?addEventListener(x[0],x[1],O):removeEventListener(x[0],x[1],O))}

  if(!q){if(host)found=top().slice(0,40)}

   if(!ok(e)||NO.test(e.tagName)||stack.some(s=>s.e===e))continue;

 if(!host)addEventListener('message',ev=>{const d=ev.data;if(!d||!d.zap||ev.source!==parent)return;
  if(d.zap==='on')set(true);else if(d.zap==='off')set(false);else if(d.zap==='undo')undo();

}
const zsc='<script>('+zapper+')()<\/script>';
const withZap=h=>/<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+zsc):/<html[^>]*>/i.test(h)?h.replace(/<html[^>]*>/i,m=>m+zsc):h+zsc;
/* ---------- pont avec les apps système (postMessage) ---------- */
const snapshot=()=>({cfg,apps:apps.map(({src,...a})=>a),base:new URL(ROOT,location.href).href});
function pushState(){document.querySelectorAll('iframe[data-sys]').forEach(f=>{try{f.contentWindow.postMessage({os:1,state:snapshot()},'*')}catch(e){}})}
function theme(){document.documentElement.dataset.theme=cfg.theme;pushState()}
const API={
 hello(){},
 setCfg(p){Object.assign(cfg,p);store.set('cfg',cfg);theme();clock();document.querySelectorAll('.zapb').forEach(b=>b.hidden=!cfg.zap)},
 addApp(a){const o=[...apps],i=apps.findIndex(x=>x.id===a.id);i<0?apps.push(a):apps[i]=a;
  if(!store.set('apps',apps)){apps=o;return false}render();notify(a.name+(i<0?' ajoutée':' mise à jour'));return true},
 removeApp(id){const i=apps.findIndex(a=>a.id===id);if(i<0)return;const a=apps.splice(i,1)[0];store.set('apps',apps);closeWin(id);render();notify(a.name+' supprimée')},
 resetApps(){apps.forEach(a=>closeWin(a.id));apps=[];store.set('apps',apps);render();notify('Toutes les apps ajoutées ont été supprimées')},
 open(id){const a=[...BUILTIN,...apps].find(x=>x.id===id);if(a)openApp(a)},
 notify(t){notify(String(t))}
};
addEventListener('message',e=>{
 const d=e.data;if(!d||typeof d!=='object')return;
 if(d.zap){const w=Object.values(wins).find(x=>x.frame&&x.frame.contentWindow===e.source);if(w)zapMsg(w,d);return}
 if(d.os!==1||!d.m||!API[d.m])return;
 if(![...document.querySelectorAll('iframe[data-sys]')].some(f=>f.contentWindow===e.source))return;
 const r=API[d.m](d.a);
 e.source.postMessage({os:1,id:d.id,r},'*');pushState();
});
theme();fit();render();renderNP();addEventListener('resize',fit);setInterval(clock,1000);
