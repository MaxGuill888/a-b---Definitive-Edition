<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abOS</title>
<style>
:root{--z:1.5;--bd:rgba(255,255,255,.26);--tile:#1e1e1e;--fg:#f4f4f4;--mut:#9a9a9e;--win:#2a2a2c;--ct:#171717;--field:#3a3a3c;--dock:rgba(28,28,28,.55);--hov:rgba(255,255,255,.1);--svg-filter:brightness(0) invert(1)}
[data-theme=light]{--bd:rgba(0,0,0,.2);--tile:#f3f3f5;--fg:#1b1b1d;--mut:#6b6b70;--win:#e6e6ea;--ct:#fbfbfc;--field:#d8d8de;--dock:rgba(244,244,247,.6);--hov:rgba(0,0,0,.08);--svg-filter:brightness(1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#111;color:var(--fg);font-family:"Open Sans","Segoe UI",system-ui,sans-serif;user-select:none}
#wp{position:fixed;inset:0;background:url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgk[...]
[data-theme=light] #wp{filter:invert(1)}
#stage{position:absolute;left:50%;top:50%;width:1366px;height:768px;margin:-384px 0 0 -683px;transform-origin:center}
.cell{position:absolute;width:80px;height:80px;cursor:grab}
.cell:active{cursor:grabbing}
.cell span{position:absolute;top:85px;left:50%;transform:translateX(-50%);width:130px;text-align:center;font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{width:80px;height:80px;border-radius:16px;background:var(--tile);border:1px solid var(--bd);display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;color:var(--fg);transition:transform .1s,filter .1s;position:relative}
button.tile:hover{transform:scale(1.06);filter:brightness(1.2)}
button.tile:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.tile img{width:100%;height:100%;object-fit:cover}
.tile svg{width:60%;height:60%;filter:var(--svg-filter)}
.tile-btn{position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(0,0,0,.4);border:none;border-radius:50%;color:var(--fg);cursor:pointer;font-size:12px;display:none;z-index:10;align-items:center;justify-content:center}
.tile:hover .tile-btn{display:flex}
.tile-btn:hover{background:rgba(0,0,0,.7)}
.letter{font-weight:700;font-size:32px;width:100%;height:100%;display:grid;place-items:center;color:#fff}
#dockbg{position:absolute;left:180px;top:660px;width:980px;height:88px;border:1px solid var(--bd);border-radius:30px;background:var(--dock);backdrop-filter:blur(18px)}
#sep{position:absolute;left:1020px;top:680px;width:3px;height:48px;border-radius:2px;background:var(--bd)}
#date{position:absolute;left:34px;top:672px;width:130px;text-align:center;font-weight:700;font-size:20px;line-height:28px}
#clock{position:absolute;left:1166px;top:676px;width:176px;text-align:center;font-weight:700;font-size:36px;line-height:48px;white-space:nowrap}
#nc{position:absolute;left:1037px;top:670px}
#nc .dot{position:absolute;top:10px;right:12px;width:10px;height:10px;border-radius:50%;background:#ff5a4f;border:2px solid var(--tile)}
/* fenêtres */
#layer{position:fixed;inset:0;pointer-events:none}
.win{position:fixed;left:0;top:0;transform:scale(var(--z));transform-origin:0 0;pointer-events:auto;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--bd);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);min-width:360px;min-height:220px}
.win.max{border-radius:0;border:0}
.tb{height:24px;flex:none;display:flex;align-items:center;padding:0 6px 0 11px;touch-action:none}
.tt{flex:1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{background:none;border:0;color:var(--fg);width:19px;height:19px;border-radius:5px;display:grid;place-items:center;cursor:pointer}
.tb button:hover{background:var(--hov)}
.tb .ex{font-size:10px;padding:2px 7px;width:auto;border:1px solid var(--bd);margin-right:6px}
.tb svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.3}
.wb{flex:1;min-height:0;display:flex;gap:7px;padding:0 6px 6px;border-radius:0 0 10px 10px}
.wb.raw{padding:0}.wb iframe{flex:1;border:0;background:#fff;border-radius:0 0 9px 9px;width:100%}
.btn{background:var(--field);color:var(--fg);border:0;border-radius:8px;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer}.btn:hover{filter:brightness(1.2)}
.hint{font-size:10.5px;color:var(--mut)}
.svgi{display:block;width:60%;height:60%}.svgi svg,.svgi img{width:100%;height:100%;filter:var(--svg-filter)}
.h{position:absolute}.h[data-e=n]{left:10px;right:10px;top:-4px;height:8px;cursor:ns-resize}.h[data-e=s]{left:10px;right:10px;bottom:-4px;height:8px;cursor:ns-resize}
.h[data-e=w]{top:10px;bottom:10px;left:-4px;width:8px;cursor:ew-resize}.h[data-e=e]{top:10px;bottom:10px;right:-4px;width:8px;cursor:ew-resize}
.h[data-e=nw]{left:-4px;top:-4px;width:14px;height:14px;cursor:nwse-resize}.h[data-e=se]{right:-4px;bottom:-4px;width:14px;height:14px;cursor:nwse-resize}
.h[data-e=ne]{right:-4px;top:-4px;width:14px;height:14px;cursor:nesw-resize}.h[data-e=sw]{left:-4px;bottom:-4px;width:14px;height:14px;cursor:nesw-resize}
.win.max .h{display:none}.dragging iframe{pointer-events:none}.dragging{user-select:none}
.win.fullscreen{pointer-events:none}.win.fullscreen .wb{pointer-events:auto}
#np{position:fixed;right:10px;top:10px;width:250px;max-height:70vh;zoom:var(--z);background:var(--win);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column}
#np[hidden]{display:none}
#np .nh{display:flex;justify-content:space-between;align-items:center}
#nl{overflow:auto;display:flex;flex-direction:column;gap:6px}
#nl div{background:var(--ct);border-radius:10px;padding:7px 9px;font-size:11.5px}#nl small{display:block;color:var(--mut);font-size:10px}
/* modal zapeur */
#zap-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9999}
#zap-modal.active{display:flex}
#zap-content{background:var(--win);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:400px;color:var(--fg)}
#zap-content h3{margin-bottom:12px}
#zap-input{width:100%;padding:8px;background:var(--field);border:1px solid var(--bd);border-radius:6px;color:var(--fg);margin-bottom:12px;font-family:inherit}
#zap-list{max-height:300px;overflow-y:auto;margin-bottom:12px}
.zap-item{padding:8px;background:var(--ct);border-radius:6px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.zap-item:hover{filter:brightness(1.2)}
#zap-buttons{display:flex;gap:8px}
.zap-btn{flex:1;padding:8px;background:var(--field);border:1px solid var(--bd);border-radius:6px;color:var(--fg);cursor:pointer;font-family:inherit}
.zap-btn:hover{filter:brightness(1.2)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div id="wp"></div>
<div id="stage"></div>
<div id="layer"></div>
<div id="np" hidden><div class="nh"><b>Centre de notifications</b><button class="btn" id="clr">Effacer</button></div><div id="nl"></div></div>

<!-- Modal Zapeur -->
<div id="zap-modal">
  <div id="zap-content">
    <h3>🔍 Rechercher et supprimer</h3>
    <input type="text" id="zap-input" placeholder="Nom de l'élément à supprimer...">
    <div id="zap-list"></div>
    <div id="zap-buttons">
      <button class="zap-btn" id="zap-close">Fermer</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let apps=store.get('apps',[]);
let cfg=Object.assign({theme:'dark',h24:true,sec:false,zap:false,focus:false},store.get('cfg',{}));
const I={bell:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a4 4 0 0 0-4 4v2.5L2.6 11h10.8L12 8.5V6a4 4 [...]
/* ROOT = chemin vers le dossier src/ : vide quand index.html est dans src/ (ton dépôt), 'src/' si la page est servie depuis la racine.
   Apps système : 'Dossier:Nom affiché' -> src/apps/Dossier/Dossier.html + src/apps/Dossier/icons/Dossier.svg
   Pour ajouter une app : ajoute par exemple 'Ai:Ai' ou 'Chat:Chat' à cette liste. */
const ROOT=/\/src(\/|$)/.test(location.pathname)?'':'src/';
const BUILTIN=['Settings:Paramètres','Store:App Store'].map(s=>{const[d,n]=s.split(':');
 return{id:d,name:n,def:1,src:`${ROOT}apps/${d}/${d}.html`,icon:`${ROOT}apps/${d}/icons/${d}.svg`}});
const iconCache={};
function loadIcons(root){root.querySelectorAll('.svgi').forEach(el=>{const u=el.dataset.src;
 if(iconCache[u])return el.innerHTML=iconCache[u];
 fetch(u).then(r=>{if(!r.ok)throw 0;return r.text()}).then(x=>{iconCache[u]=x.replace(/\s(width|height)="\d+"/g,'');el.innerHTML=iconCache[u]})
 .catch(()=>el.innerHTML=`<img src="${u}" alt="">`)})}
let Z=1.5;
function fit(){
 const s=Math.min(innerWidth/1366,innerHeight/768);
 $('#stage').style.transform=`scale(${s})`;
 Z=1.5*s;document.documentElement.style.setProperty('--z',Z);
 Object.values(wins).forEach(place);
}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function iconHTML(a){
 if(a.def||a.repo&&/\.svg(\?|$)/i.test(a.icon))return `<i class="svgi" data-src="${esc(a.icon)}"></i>`;
 const l=`<div class="letter" style="background:hsl(${hue(a.name)} 35% 32%)">${esc((a.name[0]||'?').toUpperCase())}</div>`;
 if(!a.icon)return l;
 return `<img src="${esc(a.icon)}" alt="" onerror="this.outerHTML=this.dataset.f" data-f="${esc(l)}">`;
}

// Zapeur d'éléments
function toggleZapMode(el){
 el.classList.toggle('zap-active');
 if(el.classList.contains('zap-active')){
  notify('Mode Zapeur activé - cliquez sur ⚡ pour supprimer des éléments');
 }else{
  notify('Mode Zapeur désactivé');
 }
}
function deleteElement(el){
 if(el.dataset.appId){
  const app=apps.find(a=>a.id===el.dataset.appId);
  if(app){
   window.OS.removeApp(el.dataset.appId);
   render();
  }
 }else if(el.dataset.builtinId){
  notify('❌ Impossible de supprimer une app système');
 }
}
function showZapSearch(){
 const zapModal=$('#zap-modal');
 const zapInput=$('#zap-input');
 const zapList=$('#zap-list');
 zapModal.classList.add('active');
 zapInput.value='';
 zapList.innerHTML='';
 updateZapList('');
 zapInput.focus();
 zapInput.oninput=()=>updateZapList(zapInput.value);
}
function updateZapList(query){
 const zapList=$('#zap-list');
 const all=[...BUILTIN,...apps];
 const matches=query?all.filter(a=>a.name.toLowerCase().includes(query.toLowerCase())):all;
 zapList.innerHTML=matches.map(a=>`
  <div class="zap-item" data-id="${a.id}">
   <span>${esc(a.name)}</span>
   <button class="zap-btn" style="flex:none;width:60px" onclick="removeAppFromModal('${a.id}')">Supp.</button>
  </div>
 `).join('');
}
function removeAppFromModal(id){
 window.OS.removeApp(id);
 render();
 updateZapList($('#zap-input').value);
}
$('#zap-close').onclick=()=>$('#zap-modal').classList.remove('active');
$('#zap-modal').onclick=e=>{if(e.target===$('#zap-modal'))$('#zap-modal').classList.remove('active')};

function cell(a,x,y,label=true){
 const c=document.createElement('div');c.className='cell';c.style.left=x+'px';c.style.top=y+'px';
 c.dataset.appId=a.id;c.dataset.x=x;c.dataset.y=y;c.draggable=true;
 const isBuiltin=a.def||a.repo;
 if(!isBuiltin)c.dataset.appId=a.id;
 if(isBuiltin)c.dataset.builtinId=a.id;
 
 let btn=``;
 if(cfg.zap){
  btn=`<button class="tile-btn zap-btn" title="Supprimer" onclick="deleteElement(this.parentElement.parentElement)">⚡</button>`;
 }
 
 c.innerHTML=`<button class="tile" aria-label="${esc(a.name)}" oncontextmenu="if(event.ctrlKey){showZapSearch();event.preventDefault()}">${iconHTML(a)}${btn}</button>${label?`<span>${esc(a.name)}</span>`:''}`;
 c.firstChild.onclick=(e)=>{if(!e.target.closest('.tile-btn'))openApp(a)};
 
 // Drag & drop pour déplacer les apps
 c.ondragstart=e=>{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify({id:a.id,x:parseInt(c.style.left),y:parseInt(c.style.top)}))};
 c.ondragover=e=>e.preventDefault();
 c.ondrop=e=>{e.preventDefault();e.stopPropagation()};
 
 return c;
}
function render(){
 const all=[...BUILTIN,...apps],st=$('#stage');
 st.innerHTML='<div id="dockbg"></div><div id="sep"></div><div id="date"></div><div id="clock"></div>';
 
 // Grid 5x4 pour les apps (plus petit)
 all.slice(0,20).forEach((a,i)=>st.append(cell(a,50+142*(i%5),90+150*(i/5|0))));
 
 // Dock en bas (7 apps)
 all.slice(20,27).forEach((a,i)=>st.append(cell(a,250+128*i,670,false)));
 
 const n=document.createElement('div');n.id='nc';n.className='cell';n.style.left='1030px';n.style.top='665px';
 n.innerHTML=`<button class="tile" aria-label="Centre de notifications">${I.bell}</button>${unread?'<i class="dot"></i>':''}`;
 n.firstChild.onclick=e=>{e.stopPropagation();toggleNP()};st.append(n);
 
 // Ajouter le bouton Zapeur si activé
 if(cfg.zap){
  const zapBtns=st.querySelectorAll('.tile-btn.zap-btn');
  zapBtns.forEach(btn=>{
   btn.onclick=function(e){
    e.stopPropagation();
    deleteElement(this.parentElement.parentElement);
   };
   btn.oncontextmenu=function(e){
    e.preventDefault();
    e.stopPropagation();
    showZapSearch();
   };
  });
 }
 
 loadIcons(st);clock();
}
function clock(){
 const d=new Date(),p=x=>String(x).padStart(2,'0');let h=d.getHours();if(!cfg.h24)h=h%12||12;
 const c=$('#clock');if(!c)return;
 c.textContent=`${p(h)}:${p(d.getMinutes())}`+(cfg.sec?':'+p(d.getSeconds()):'');
 const w=d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','');
 $('#date').innerHTML=`${esc(w[0].toUpperCase()+w.slice(1))} ${d.getDate()}<br>${p(d.getMonth()+1)}/${d.getFullYear()}`;
}
/* notifications */
let notes=[],unread=0;
function notify(t){notes.unshift({t,d:new Date()});unread++;renderNP();render()}
function renderNP(){$('#nl').innerHTML=notes.length?notes.map(n=>`<div>${esc(n.t)}<small>${n.d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):'<p class="hint">Aucune notification</p>'}
function toggleNP(){const p=$('#np');p.hidden=!p.hidden;if(!p.hidden){unread=0;renderNP();render()}}
$('#clr').onclick=()=>{notes=[];renderNP()};
addEventListener('pointerdown',e=>{const p=$('#np');if(!p.hidden&&!p.contains(e.target)&&!e.target.closest('#nc'))p.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#np').hidden=true});
/* gestionnaire de fenêtres */
const wins={};let zi=10,nwin=0;
const MINW=360,MINH=220;
function place(w){
 const s=w.el.style;
 if(w.max){s.left=s.top='0';s.width=innerWidth/Z+'px';s.height=innerHeight/Z+'px'}
 else{s.left=w.x*Z+'px';s.top=w.y*Z+'px';s.width=w.w+'px';s.height=w.h+'px'}
 w.el.classList.toggle('max',w.max);
}
function focus(w){w.el.style.zIndex=++zi}
function drag(e,w,mode){
 if(w.max||e.button>0)return;e.preventDefault();focus(w);document.body.classList.add('dragging');
 const sx=e.clientX,sy=e.clientY,o={x:w.x,y:w.y,w:w.w,h:w.h};
 const mv=ev=>{const dx=(ev.clientX-sx)/Z,dy=(ev.clientY-sy)/Z;
  if(mode==='move'){w.x=o.x+dx;w.y=Math.max(0,o.y+dy)}else{
   if(mode.includes('e'))w.w=Math.max(MINW,o.w+dx);
   if(mode.includes('s'))w.h=Math.max(MINH,o.h+dy);
   if(mode.includes('w')){const nw=Math.max(MINW,o.w-dx);w.x=o.x+o.w-nw;w.w=nw}
   if(mode.includes('n')){const nh=Math.max(MINH,o.h-dy);w.y=Math.max(0,o.y+o.h-nh);w.h=nh}}
  place(w)};
 const up=()=>{removeEventListener('pointermove',mv);document.body.classList.remove('dragging')};
 addEventListener('pointermove',mv);addEventListener('pointerup',up,{once:true});
}
function openWin(key,title,{raw=false,extra=''}={}){
 if(wins[key]){const w=wins[key];w.el.hidden=false;focus(w);return null}
 const el=document.createElement('div');el.className='win';el.setAttribute('role','dialog');el.setAttribute('aria-label',title);
 el.innerHTML=`<div class="tb"><span class="tt">${esc(title)}</span>${extra}
 <button data-a="min" aria-label="Réduire"><svg viewBox="0 0 10 10"><path d="M1 8.5h8"/></svg></button>
 <button data-a="max" aria-label="Agrandir"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg></button>
 <button data-a="x" aria-label="Fermer"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button></div>
 <div class="wb${raw?' raw':''}"></div>`+['n','s','e','w','ne','nw','se','sw'].map(d=>`<i class="h" data-e="${d}"></i>`).join('');
 $('#layer').append(el);
 const w={el,x:(innerWidth/Z-580)/2+nwin%5*18,y:(innerHeight/Z-345)/2+nwin%5*18,w:580,h:345,max:false};nwin++;
 w.x=Math.max(0,w.x);w.y=Math.max(0,w.y);wins[key]=w;
 const tog=()=>{w.max=!w.max;place(w)};
 el.querySelectorAll('.h').forEach(h=>h.onpointerdown=e=>drag(e,w,h.dataset.e));
 el.querySelector('.tb').onpointerdown=e=>{if(!e.target.closest('button'))drag(e,w,'move')};
 el.querySelector('.tb').ondblclick=e=>{if(!e.target.closest('button'))tog()};
 el.onpointerdown=()=>focus(w);
 el.querySelector('[data-a=min]').onclick=()=>el.hidden=true;
 el.querySelector('[data-a=max]').onclick=tog;
 el.querySelector('[data-a=x]').onclick=()=>{el.remove();delete wins[key]};
 place(w);focus(w);return el.querySelector('.wb');
}
function closeWin(id){if(wins[id]){wins[id].el.remove();delete wins[id]}}
function openApp(a){
 const url=a.type==='url';
 const b=openWin(a.id,a.name,{raw:true,extra:url?'<button class="ex">Ouvrir dans un onglet</button>':''});
 if(!b)return;
 const f=document.createElement('iframe');
 if(a.def){f.src=a.src;f.style.background='transparent';f.onload=()=>{syncTheme();if(cfg.focus)addFocusButton(wins[a.id])}}
 else if(url){f.src=a.src;f.sandbox='allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads';
  wins[a.id].el.querySelector('.ex').onclick=()=>window.open(a.src,'_blank','noopener')}
 else{f.srcdoc=a.src;f.sandbox='allow-scripts allow-forms allow-popups allow-modals allow-downloads'}
 b.append(f);
}

// Bouton Focus pour capturer souris/clavier
function addFocusButton(w){
 if(w.el.querySelector('.focus-btn'))return;
 const btn=document.createElement('button');
 btn.className='ex focus-btn';
 btn.textContent='📌 Focus';
 btn.title='Capturer le focus souris/clavier pour le jeu';
 btn.onclick=()=>requestFullscreenFocus(w.el.querySelector('iframe'));
 w.el.querySelector('.tb').appendChild(btn);
}
function requestFullscreenFocus(iframe){
 if(!iframe)return;
 const parent=iframe.parentElement;
 parent.classList.add('fullscreen');
 iframe.focus();
 iframe.click();
 parent.requestPointerLock=parent.requestPointerLock||parent.mozRequestPointerLock;
 if(parent.requestPointerLock){
  parent.requestPointerLock();
 }
 // Sortir du mode fullscreen
 const exitHandler=()=>{
  if(!document.pointerLockElement&&!document.mozPointerLockElement){
   parent.classList.remove('fullscreen');
   document.removeEventListener('pointerlockchange',exitHandler);
   document.removeEventListener('mozpointerlockchange',exitHandler);
  }
 };
 document.addEventListener('pointerlockchange',exitHandler);
 document.addEventListener('mozpointerlockchange',exitHandler);
}

function syncTheme(){
 document.querySelectorAll('iframe').forEach(f=>{
  try{
   f.contentDocument.documentElement.dataset.theme=cfg.theme;
   f.contentDocument.documentElement.style.setProperty('--svg-filter',getComputedStyle(document.documentElement).getPropertyValue('--svg-filter'));
  }catch(e){}
 })
}
function theme(){
 document.documentElement.dataset.theme=cfg.theme;
 syncTheme();
}
/* API exposée aux apps système (window.parent.OS) */
window.OS={
 get cfg(){return cfg},get apps(){return apps},
 setCfg(p){Object.assign(cfg,p);store.set('cfg',cfg);theme();clock();render()},
 addApp(a){const o=[...apps],i=apps.findIndex(x=>x.id===a.id);i<0?apps.push(a):apps[i]=a;if(!store.set('apps',apps)){apps=o;return false}render();notify(a.name+(i<0?' ajoutée':' mise à jour'));return true},
 removeApp(id){const i=apps.findIndex(a=>a.id===id);if(i<0)return;const a=apps.splice(i,1)[0];store.set('apps',apps);closeWin(id);render();notify(a.name+' supprimée')},
 resetApps(){apps.forEach(a=>closeWin(a.id));apps=[];store.set('apps',apps);render();notify('Toutes les apps ajoutées ont été supprimées')},
 open:openApp,notify,url:p=>new URL(ROOT+p,location.href).href,toggleZap:()=>{cfg.zap=!cfg.zap;store.set('cfg',cfg);render()}
};
theme();fit();render();renderNP();addEventListener('resize',fit);setInterval(clock,1000);
